name: Ask Intros Bridge Design Parity

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/public-search-check/**'
      - 'scripts/customize-contrast-check/**'
      - 'scripts/dashboard-network-layout-check/**'
      - 'scripts/editorial-copy-contrast-check/**'
      - 'scripts/voice-read-aloud-check/**'
      - '.github/workflows/ask-intros-design-parity.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/ask-intros-design-parity.yml'

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies from public registry
        run: |
          bun install --frozen-lockfile
      - name: Verify unchanged Bridge source and generated style scope
        run: |
          node scripts/bridge-reference/check.mjs
          node scripts/bridge-reference/styles.mjs --check
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Build production bundle
        run: npx vite build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Public search crawlability and guide layout
        env:
          PUBLIC_SEARCH_BROWSER: '1'
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/public-search-check/run.mjs
      - name: Published Bridge Social View and Business state retention (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/experience-check/ci.mjs
      - name: Dashboard and Network density (desktop, tablet and mobile browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/dashboard-network-layout-check/run.mjs
      - name: Check real Customize modal readability
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/customize-contrast-check/run.mjs
      - name: Check homepage and editorial text readability
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/editorial-copy-contrast-check/run.mjs
      - name: Read Aloud page and mobile fallback (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/voice-read-aloud-check/run.mjs
