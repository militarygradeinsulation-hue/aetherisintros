# Manual-only delivery of membership cards that still need an email.
# Scheduled runs are disabled to prevent unnecessary recurring GitHub Actions
# executions. Card generation, immediate delivery on verification, and the
# authenticated /api/cron/membership-cards endpoint remain unchanged.
# To process queued cards, launch this workflow manually with Run workflow.
name: Membership cards
on:
  workflow_dispatch:
permissions: {}
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send waiting membership cards
        env:
          DIGEST_URL: ${{ secrets.DIGEST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DIGEST_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::DIGEST_URL or CRON_SECRET is not set; skipping."
            exit 0
          fi
          ORIGIN=$(printf '%s' "$DIGEST_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$ORIGIN/api/cron/membership-cards"
