# Checks on every pull request and push to main: typecheck, unit tests, database migration
# checks (PGlite, no live data), critical browser flows and a production build.
name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      # Public-registry lockfile includes the reviewed security patches.
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
      - name: Dependency security audit
        run: bun audit --audit-level=high
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npx vitest run
      # Catch bundling failures before slow browser smoke tests.
      - name: Build
        run: npx vite build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Butler orb and cinematic entrance (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/butler-entrance-check/run.mjs
      - name: Database migration checks
        run: |
          node scripts/migration-checks/run.mjs
          node scripts/migration-checks/privacy-boundary.standalone.mjs
          node scripts/migration-checks/launch-signup.standalone.mjs
          node scripts/recovery/member-families.standalone.mjs
      - name: Business tool generation and image workflow (browser)
        run: node scripts/business-tools-automation-check/run.mjs
      - name: Member business tools, post editing and Butler controls (browser)
        run: node scripts/member-tools-check/run.mjs
      - name: Onboarding walkthrough (browser)
        run: node scripts/onboarding-check/run.mjs
      - name: Contrast and overlay safety (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/contrast-check/run.mjs
      - name: PDF attachment reader (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/workspace-components-check/run.mjs
      - name: Comment draft save confirmation (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/comment-save-check/run.mjs
      - name: Specter URL capture workspace (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/specter-check/run.mjs
      - name: Validate Opportunity Preview browser check syntax
        run: node --check scripts/opportunity-preview-check/run.mjs
      - name: Public Opportunity Preview (light/dark, desktop/phone browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/opportunity-preview-check/run.mjs
      - name: Mobile site and business journey (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/mobile-site-check/run.mjs
      - name: Compact homepage layout (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/homepage-check/run.mjs
      - name: Messages readability (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/messages-contrast-check/run.mjs
      - name: Read aloud and managed ElevenLabs voice behavior (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/voice-read-aloud-check/run.mjs
      - name: Meeting call engine (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/meeting-call-check/run.mjs
      - name: Meeting room (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/meeting-room-check/run.mjs
      - name: Deal rooms (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/deal-room-check/run.mjs
      - name: Administrator connection preflight (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/admin-connections-check/run.mjs
      - name: Live member readiness and failure states (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/member-readiness-check/run.mjs
      - name: Shared Opportunity Exchange (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/exchange-check/run.mjs
      - name: LinkedIn scan (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/linkedin-scan-check/run.mjs
      - name: LinkedIn identity review (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/linkedin-identity-check/run.mjs
      - name: Quick menu (browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/quick-menu-check/run.mjs
      - name: Architect across member pages (light and dark browser)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node scripts/architect-check/run.mjs
